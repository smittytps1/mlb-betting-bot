name: MLB AI Betting Pipeline

on:
  schedule:
    - cron: '0 15 * * *' # Runs daily at 11:00 AM EDT
  workflow_dispatch:     # Enables manual run button

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Betting Bot Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: python bot.py

      - name: Commit Updated Bot Memory
        run: |
          git config --global user.name 'MLB Bot Automator'
          git config --global user.email 'bot@github-actions'
          git add bot_memory.json || true
          git commit -m "Update bot evaluation memory" || true
          git push || true
